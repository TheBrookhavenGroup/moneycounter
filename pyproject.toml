[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "moneycounter"
description = "Portfolio Analytics Utilities"
readme = "README.md"
authors = [ {name="Marc Schwarzschild", email="ms@TheBrookhavenGroup.com"}, ]
maintainers = [ {name="Marc Schwarzschild", email="ms@TheBrookhavenGroup.com"}, ]
requires-python = ">=3.7"
keywords = ["risk", "fifo", "money", "investments"]
classifiers = [
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment"
    ]
license = {text = "MIT"}
dependencies = ["pandas", "pytz", "tbgutils"]
version = "1.4.3"

[dependency-groups]
dev = ["black", "build", "packaging", "pandas-stubs", "pre-commit", "python-dateutil", "ruff", "six", "tomli"]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations", "node_modules", "static", ".tox", ".git"]

[tool.ruff.lint]
ignore = ["E402", "E501", "E741", "W605"]

[tool.black]
line-length = 79

[project.urls]
homepage = "https://github.com/schwarzschild/moneycounter"
repository = "https://github.com/schwarzschild/moneycounter"
documentation = "https://github.com/schwarzschild/moneycounter"
